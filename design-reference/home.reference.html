.field98{padding:2px 6px;box-shadow:inset -1px -1px #dfdfdf,inset 1px 1px #808080;font-size:11px;color:#000000}
.hit{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
.neon{opacity:0;transition:opacity .5s ease;pointer-events:none;mix-blend-mode:screen}
.halo{fill:#efe6ec;stroke:#f7f2f6;stroke-width:8}
.reflect{fill:none;stroke:#eadde5;stroke-width:12}
.edge{fill:none;stroke:#f5eef3;stroke-width:3}

.tb:active{box-shadow:inset -1px -1px #ffffff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px #808080}

<script type="text/x-dc" data-dc-script data-props="{&quot;bg&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;faces&quot;,&quot;dithered gradient&quot;,&quot;grid&quot;,&quot;tile pattern&quot;,&quot;desktop + icons&quot;],&quot;default&quot;:&quot;dithered gradient&quot;},&quot;crop&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;light&quot;,&quot;tight&quot;],&quot;default&quot;:&quot;light&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;black &amp; white&quot;,&quot;soft rose&quot;,&quot;pink duotone&quot;,&quot;sepia&quot;],&quot;default&quot;:&quot;black &amp; white&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:980}}">
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tint ?? 'black & white';
    const looks = {
      'black & white': ['grayscale(1) contrast(1.1)', 0, 0],
      'soft rose': ['grayscale(1) contrast(1.1) brightness(1.05)', 0.4, 0.5],
      'pink duotone': ['grayscale(1) contrast(1.15) brightness(1.05)', 1, 1],
      'sepia': ['grayscale(1) sepia(0.6) contrast(1.05)', 0, 0]
    };
    const l = looks[t] || looks['black & white'];
    const y0 = { none: 0, light: 100, tight: 200 }[this.props.crop ?? 'light'] ?? 100;
    const h = 678 - y0;
    const pct = (v) => (v * 100).toFixed(2) + '%';
    const bg = this.props.bg ?? 'dithered gradient';
    return {
      bgClass: { 'faces': 'bg-faces', 'grid': 'bg-grid', 'tile pattern': 'bg-tile', 'dithered gradient': 'bg-dither', 'desktop + icons': 'bg-desktop' }[bg] || 'bg-dither',
      showIcons: bg === 'desktop + icons',
      imgFilter: l[0], pinkOpacity: l[1], redOpacity: l[2],
      cropAspect: '1180 / ' + h,
      imgTop: pct(-y0 / h), imgHeight: pct(678 / h),
      viewBox: '0 ' + y0 + ' 1180 ' + h,
      tagTop: pct((298 - y0) / h)
    };
  }
}
</script>
